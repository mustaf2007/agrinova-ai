name: AgriNova AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py modules
      - name: Smoke-test report exports
        run: |
          python - <<'PY'
          from modules.reporting import build_farm_report_csv, build_farm_report_pdf
          from modules.agronomy import assess_soil
          import pandas as pd
          from modules.soil_lab import normalize_soil_lab_data, soil_lab_summary

          sample = {
              "location": "Mogadishu, Somalia",
              "crop": "Maize",
              "variety": "Example cultivar",
              "area_ha": 2,
              "ecocrop_indicators": [("Optimal temperature range", "18 to 30 °C")],
              "forecast_daily": [{"date": "2026-11-24", "temp_max": 30, "temp_min": 22, "precipitation": 1.5}],
              "historical_daily": [{"date": "2026-11-10", "temperature_c": 27.5, "precipitation_mm_day": 0.2}],
          }
          csv_data = build_farm_report_csv(sample)
          pdf_data = build_farm_report_pdf(sample)
          assert csv_data.startswith(b"\xef\xbb\xbf")
          assert b"Maize" in csv_data
          assert b"Open-Meteo" in csv_data
          assert b"NASA POWER" in csv_data
          assert b"2026-11-10" in csv_data
          assert pdf_data.startswith(b"%PDF-")
          assert len(pdf_data) > 1000
          soil_missing = assess_soil(None, None, None, None, None, None, "Maize")
          assert len(soil_missing) == 1
          assert soil_missing[0][0] == "Crop context"
          soil_ph_only = assess_soil(6.8, None, None, None, None, None, "Maize")
          assert any(label == "Soil reaction" for label, _ in soil_ph_only)
          assert not any(label == "Organic matter" for label, _ in soil_ph_only)
          lab_input = pd.DataFrame({
              "Sample": ["A", "B", "C"],
              "Depth_cm": [0, 15, 30],
              "pH_lab": [6.5, 7.2, 18],
              "OM_pct": [2.1, None, 1.4],
          })
          lab_clean, lab_check = normalize_soil_lab_data(
              lab_input,
              {"sample_id": "Sample", "depth_cm": "Depth_cm", "soil_ph": "pH_lab", "organic_matter_pct": "OM_pct"},
          )
          assert lab_check["rows_uploaded"] == 3
          assert lab_check["rows_with_measurements"] == 3
          assert pd.isna(lab_clean.loc[2, "soil_ph"])
          assert len(soil_lab_summary(lab_clean)) == 2
          print("PDF/CSV exports, soil missingness and lab-import checks passed.")
          PY
