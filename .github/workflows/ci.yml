name: AgriNova AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py modules
      - name: Smoke-test report exports
        run: |
          python - <<'PY'
          from modules.reporting import build_farm_report_csv, build_farm_report_pdf
          from modules.agronomy import assess_soil
          import pandas as pd
          from modules.soil_lab import normalize_soil_lab_data, soil_lab_summary, soil_lab_group_summary
          from modules.crop_suitability import assess_crop_environment
          from modules.crop_suitability import normalize_spatial_observations, validate_geojson_boundaries
          from modules.soilgrids_wcs import parse_wcs_coverages, get_coverage_request_params, fetch_nitrogen_geotiff
          from unittest.mock import patch
          from types import SimpleNamespace

          sample = {
              "location": "Mogadishu, Somalia",
              "crop": "Maize",
              "variety": "Example cultivar",
              "area_ha": 2,
              "ecocrop_indicators": [("Optimal temperature range", "18 to 30 °C")],
              "forecast_daily": [{"date": "2026-11-24", "temp_max": 30, "temp_min": 22, "precipitation": 1.5}],
              "historical_daily": [{"date": "2026-11-10", "temperature_c": 27.5, "precipitation_mm_day": 0.2}],
          }
          csv_data = build_farm_report_csv(sample)
          pdf_data = build_farm_report_pdf(sample)
          assert csv_data.startswith(b"\xef\xbb\xbf")
          assert b"Maize" in csv_data
          assert b"Open-Meteo" in csv_data
          assert b"NASA POWER" in csv_data
          assert b"2026-11-10" in csv_data
          assert pdf_data.startswith(b"%PDF-")
          assert len(pdf_data) > 1000
          soil_missing = assess_soil(None, None, None, None, None, None, "Maize")
          assert len(soil_missing) == 1
          assert soil_missing[0][0] == "Crop context"
          soil_ph_only = assess_soil(6.8, None, None, None, None, None, "Maize")
          assert any(label == "Soil reaction" for label, _ in soil_ph_only)
          assert not any(label == "Organic matter" for label, _ in soil_ph_only)
          lab_input = pd.DataFrame({
              "Sample": ["A", "B", "C"],
              "Depth_cm": [0, 15, 30],
              "pH_lab": [6.5, 7.2, 18],
              "OM_pct": [2.1, None, 1.4],
          })
          lab_clean, lab_check = normalize_soil_lab_data(
              lab_input,
              {"sample_id": "Sample", "depth_cm": "Depth_cm", "soil_ph": "pH_lab", "organic_matter_pct": "OM_pct"},
          )
          assert lab_check["rows_uploaded"] == 3
          assert lab_check["rows_with_measurements"] == 3
          assert pd.isna(lab_clean.loc[2, "soil_ph"])
          assert len(soil_lab_summary(lab_clean)) == 2
          grouped_lab = soil_lab_group_summary(lab_clean, "depth_cm")
          assert len(grouped_lab) == 3
          assert "Soil pH median" in grouped_lab.columns
          crop_checks = assess_crop_environment({"topmn": 18, "topmx": 30, "phmin": 5.0, "phmax": 8.0}, 27.0, 6.5)
          assert crop_checks[0]["Comparison"] == "Within reference range"
          assert crop_checks[1]["Comparison"] == "Within reference range"
          missing_checks = assess_crop_environment({"topmn": None, "topmx": None}, None, None)
          assert all(row["Comparison"] == "Not assessed" for row in missing_checks)
          spatial_input = pd.DataFrame({
              "lat": [2.04, 95, None],
              "lon": [45.3, 45.0, 40.0],
              "temp": [27.0, 25.0, 26.0],
              "ph": [6.5, 7.0, 6.0],
          })
          spatial_clean, spatial_warnings = normalize_spatial_observations(
              spatial_input, "lat", "lon", "temp", "ph"
          )
          assert len(spatial_clean) == 1
          assert spatial_clean.loc[0, "latitude"] == 2.04
          assert len(spatial_warnings) == 1
          polygon = {
              "type": "Feature",
              "properties": {"farm": "Test plot"},
              "geometry": {"type": "Polygon", "coordinates": [[[45.0, 2.0], [45.1, 2.0], [45.1, 2.1], [45.0, 2.0]]]},
          }
          boundary, boundary_warnings, boundary_bounds = validate_geojson_boundaries(polygon)
          assert boundary is not None
          assert len(boundary["features"]) == 1
          assert boundary_bounds == [[2.0, 45.0], [2.1, 45.1]]
          assert not boundary_warnings
          invalid_polygon = {
              "type": "Polygon",
              "coordinates": [[[45.0, 2.0], [45.1, 2.0], [45.1, 2.1], [45.0, 2.1]]],
          }
          rejected, rejected_warnings, rejected_bounds = validate_geojson_boundaries(invalid_polygon)
          assert rejected is None
          assert rejected_warnings
          assert rejected_bounds is None
          mixed = {
              "type": "FeatureCollection",
              "features": [polygon, {"type": "Feature", "properties": {}, "geometry": {"type": "Point", "coordinates": [45, 2]}}],
          }
          partial, partial_warnings, _ = validate_geojson_boundaries(mixed)
          assert partial is not None and len(partial["features"]) == 1
          assert len(partial_warnings) == 1
          capabilities_xml = """<?xml version="1.0"?>
          <Capabilities xmlns="http://www.opengis.net/wcs/2.0">
            <Contents>
              <CoverageSummary><CoverageId>nitrogen_0-5cm_Q0.5</CoverageId></CoverageSummary>
              <CoverageSummary><CoverageId>nitrogen_5-15cm_Q0.5</CoverageId></CoverageSummary>
              <CoverageSummary><CoverageId>nitrogen_15-30cm_Q0.5</CoverageId></CoverageSummary>
            </Contents>
          </Capabilities>"""
          coverages = parse_wcs_coverages(capabilities_xml)
          assert coverages == [
              "nitrogen_0-5cm_Q0.5",
              "nitrogen_5-15cm_Q0.5",
              "nitrogen_15-30cm_Q0.5",
          ]
          try:
              parse_wcs_coverages("<not-valid-xml")
              raise AssertionError("Malformed XML should be rejected.")
          except ValueError:
              pass
          try:
              parse_wcs_coverages("<Capabilities />")
              raise AssertionError("Capabilities without identifiers should be rejected.")
          except ValueError:
              pass
          wcs_params = get_coverage_request_params(
              "nitrogen_0-5cm_Q0.5",
              [[2.0, 45.0], [2.05, 45.05]],
          )
          assert ("REQUEST", "GetCoverage") in wcs_params
          assert ("COVERAGEID", "nitrogen_0-5cm_Q0.5") in wcs_params
          assert len([item for item in wcs_params if item[0] == "SUBSET"]) == 2
          assert any(item[0] == "SUBSETTINGCRS" for item in wcs_params)
          x_subset = next(value for key, value in wcs_params if key == "SUBSET" and value.startswith("X("))
          y_subset = next(value for key, value in wcs_params if key == "SUBSET" and value.startswith("Y("))
          assert "5008359" in x_subset and "5013871" in x_subset
          assert "222638" in y_subset and "228205" in y_subset

          try:
              get_coverage_request_params("soc_0-5cm_Q0.5", [[2.0, 45.0], [2.05, 45.05]])
              raise AssertionError("Non-nitrogen coverage should be rejected.")
          except ValueError:
              pass
          try:
              get_coverage_request_params("nitrogen_0-5cm_Q0.5", [[2.0, 45.0], [2.3, 45.05]])
              raise AssertionError("Oversized extent should be rejected.")
          except ValueError:
              pass
          fake_tiff_response = SimpleNamespace(
              headers={"Content-Type": "image/tiff"},
              raise_for_status=lambda: None,
              iter_content=lambda chunk_size: [b"II*\x00test-raster"],
          )
          with patch("modules.soilgrids_wcs.requests.get", return_value=fake_tiff_response):
              raster_bytes = fetch_nitrogen_geotiff(
                  "nitrogen_0-5cm_Q0.5",
                  [[2.0, 45.0], [2.05, 45.05]],
              )
          assert raster_bytes.startswith(b"II*\x00")
          fake_error_response = SimpleNamespace(
              headers={"Content-Type": "text/xml"},
              raise_for_status=lambda: None,
              iter_content=lambda chunk_size: [b"<ExceptionReport/>"],
          )
          with patch("modules.soilgrids_wcs.requests.get", return_value=fake_error_response):
              try:
                  fetch_nitrogen_geotiff(
                      "nitrogen_0-5cm_Q0.5",
                      [[2.0, 45.0], [2.05, 45.05]],
                  )
                  raise AssertionError("OGC exception XML should not be accepted as a raster.")
              except ValueError:
                  pass
          print("PDF/CSV exports, soil missingness and lab-import checks passed.")
          PY
